listener 1883
allow_anonymous true
# The broker answers PUBACK to the vest, so it is the first durable hop: queued messages survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
# Ingest acknowledges a message only after Kafka has it; until then the broker queues messages for its persistent session.
max_queued_messages 500000
max_inflight_messages 0
sys_interval 2
log_type error
log_type warning
